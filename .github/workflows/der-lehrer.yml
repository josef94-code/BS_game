# Baut DER LEHRER als portable Windows-Anwendung (eine .exe) und stellt sie als Download bereit.
name: DER LEHRER – Windows-Build

on:
  push:
    paths:
      - "der-lehrer/**"
      - ".github/workflows/der-lehrer.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: der-lehrer
    steps:
      - uses: actions/checkout@v4

      - name: Godot und Windows-Exportvorlage laden
        run: |
          V=${GODOT_VERSION}-stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${V}_linux.x86_64 /usr/local/bin/godot && rm godot.zip
          curl -sSL -o vorlagen.tpz https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz
          ZIEL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $ZIEL
          unzip -joq vorlagen.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d $ZIEL
          rm vorlagen.tpz

      - name: Projekt importieren
        run: godot --headless --import

      - name: Daten prüfen
        run: godot --headless -s tests/test_daten.gd

      - name: Windows-Export
        run: |
          mkdir -p ../build
          godot --headless --export-release "Windows portable" ../build/DerLehrer.exe
          ls -la ../build

      - uses: actions/upload-artifact@v4
        with:
          name: DerLehrer-Windows
          path: build/DerLehrer.exe
